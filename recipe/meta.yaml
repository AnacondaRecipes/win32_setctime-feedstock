{% set name = "win32_setctime" %}
{% set version = "1.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 077b35471bf1ff1d71e165c919ddc0cecf51b8e1802f5d820d33a96e2f6717dd

build:
  number: 0
  # This library is only useful on Windows but there is no constraint on OS
  # or Python version.
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  skip: true  # [py<35]

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python

test:
  requires:
    - pip
    - python
  imports:
    - win32_setctime
  commands:
    - pip check

about:
  home: https://github.com/Delgan/win32-setctime
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A small Python utility to set file creation time on Windows
  doc_url: https://github.com/Delgan/win32-setctime

extra:
  recipe-maintainers:
    - xhochy
